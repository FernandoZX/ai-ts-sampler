<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Rápido</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <h1>⚡ Click Rápido</h1>
    <p>Pulsa tantas veces como puedas en 10 segundos.</p>

    <section class="stats">
      <div>
        <span id="time">10.0</span>
        <small>segundos</small>
      </div>
      <div>
        <span id="score">0</span>
        <small>puntos</small>
      </div>
    </section>

    <button id="clickButton" class="click-button" disabled>¡PULSA!</button>
    <button id="startButton" class="start-button">Empezar</button>

    <p id="message" class="message" aria-live="polite">¿Preparado?</p>
    <p class="record">Récord: <strong id="record">0</strong></p>
  </main>

  <script src="game.js"></script>
</body>
</html>
